<body>
<style>
/* Layout: barra fixa de busca + navegacao lateral persistente + uma secao por vez, estilo consulta rapida de oficina.
   Cor: vermelho da marca FASE 1 (gradiente #EC3237 -> #C62D49) como unico acento; laranja para alerta, verde para confirmacao. */
:root{
  --bg:#EFF0F2; --surface:#FFFFFF; --surface2:#F6F6F8; --ink:#16181D; --muted:#5F6671; --line:#D8DADF;
  --amber:#C1202F; --amber-soft:#FCEBED; --steel:#2B4C73; --steel-soft:#EBF0F6;
  --green:#1C7355; --green-soft:#E6F3EE; --red:#9A5312; --red-soft:#FDF1E3;
  --grad:linear-gradient(135deg,#EC3237,#C62D49);
  --shadow:0 1px 2px rgba(22,24,29,.07), 0 6px 18px rgba(22,24,29,.05);
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#101216; --surface:#181B21; --surface2:#1F232B; --ink:#E7E9ED; --muted:#99A1AC; --line:#2A2F38;
  --amber:#FF6068; --amber-soft:#2B1115; --steel:#7FA8D8; --steel-soft:#141C26;
  --green:#4FB18A; --green-soft:#0E1F19; --red:#E3A258; --red-soft:#2A1C0C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.32); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#181B21; --surface2:#1F232B; --ink:#E7E9ED; --muted:#99A1AC; --line:#2A2F38;
  --amber:#FF6068; --amber-soft:#2B1115; --steel:#7FA8D8; --steel-soft:#141C26;
  --green:#4FB18A; --green-soft:#0E1F19; --red:#E3A258; --red-soft:#2A1C0C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.32); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0}
a{color:var(--steel)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- topo ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:19px;font-style:italic;letter-spacing:-.4px;white-space:nowrap;color:var(--amber)}
@supports (-webkit-background-clip:text) or (background-clip:text){
  .brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.searchwrap{flex:1;min-width:0;position:relative}
#q{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink);font-size:14px;font-family:inherit}
#q::placeholder{color:var(--muted)}
.mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.tbtn{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:7px;padding:8px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{color:var(--ink)}

/* ---------- navegacao ---------- */
.shell{max-width:1240px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:216px minmax(0,1fr);gap:26px;align-items:start}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;gap:2px}
.nav-lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px 10px}
.nav-lbl:first-child{margin-top:0}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--muted);
  padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:500;border-left:2px solid transparent}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--surface);color:var(--ink);border-left-color:var(--amber);box-shadow:var(--shadow);font-weight:600}
nav button i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--amber);width:20px;flex:none}

/* ---------- conteudo ---------- */
section[data-sec]{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){section[data-sec]{animation:none}}
.sec-head{margin-bottom:16px}
.eyebrow{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--amber);font-weight:600}
h2{font-size:27px;font-weight:800;letter-spacing:-.4px;margin:3px 0 4px}
.sec-head p{margin:0;color:var(--muted);font-size:14.5px;max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
h3{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
ul.l{margin:0;padding-left:17px}
ul.l li{margin:4px 0}
.note{border-left:3px solid var(--amber);background:var(--amber-soft);padding:11px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note.ok{border-color:var(--green);background:var(--green-soft)}
.note.warn{border-color:var(--red);background:var(--red-soft)}
.note b{font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.led{color:var(--steel);border-color:var(--steel);background:var(--steel-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line)}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-weight:600;white-space:nowrap}

/* ---------- metas de referencia ---------- */
.alvo{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow);display:flex;gap:11px;align-items:baseline}
.alvo b{font-family:var(--mono);font-size:27px;font-weight:600;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.alvo span{font-size:12.5px;color:var(--muted);line-height:1.35}
.alvo strong{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .25s}

/* ---------- calculadora ---------- */
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=number],input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink);font-family:var(--mono);font-size:14px}
.out{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.out:last-child{border-bottom:0}
.out span{font-size:13.5px;color:var(--muted)}
.out b{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.out.hi b{color:var(--amber);font-size:23px}

/* ---------- listas interativas ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{max-height:430px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.prow{display:flex;gap:11px;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);font-size:13.5px}
.prow:last-child{border-bottom:0}
.prow code{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:46px}
.prow .nm{flex:1;min-width:0}
.ico{width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:7px;background:var(--surface2);
  display:grid;place-items:center;color:var(--amber)}
.ico svg{width:20px;height:20px;display:block}
.fambox{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--amber);
  background:var(--surface2);border-radius:9px;padding:12px 14px;margin-bottom:12px}
.fambox .ico{width:52px;height:52px;background:var(--surface)}
.fambox .ico svg{width:30px;height:30px}
.fambox h4{font-family:var(--display);font-size:15px;font-weight:700;margin:0 0 3px}
.fambox p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.fambox .pg{margin-top:6px;font-size:12.5px;font-style:italic;color:var(--ink)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px;display:block}
details{border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:8px;box-shadow:var(--shadow)}
details summary{cursor:pointer;padding:12px 15px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--mono);color:var(--amber);font-size:17px}
details[open] summary::after{content:"–"}
details .body{padding:0 15px 14px;font-size:14px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px;cursor:pointer;border-bottom:1px dashed var(--line)}
.ck:last-child{border-bottom:0}
.ck input{margin:3px 0 0;accent-color:var(--amber);width:16px;height:16px;flex:none}
.ck.on span{color:var(--muted);text-decoration:line-through}
.script{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;position:relative}
.script p{margin:0 0 7px}
.copy{position:absolute;top:9px;right:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer}
.copy:hover{color:var(--ink);border-color:var(--amber)}
.stepflow{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.stepflow div{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:9px;padding:11px 13px;font-size:13.5px}
.stepflow div b{display:block;margin-bottom:3px;font-size:14px}

/* ---------- busca ---------- */
#results{position:absolute;left:0;right:0;top:calc(100% + 7px);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow);max-height:62vh;overflow-y:auto;z-index:50}
#results button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13.5px}
#results button:last-child{border-bottom:0}
#results button:hover{background:var(--surface2)}
#results .where{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
#results .empty{padding:14px;color:var(--muted);font-size:13.5px}
mark{background:var(--amber-soft);color:var(--ink);padding:0 2px;border-radius:2px}

.grid > *{min-width:0}
@media (max-width:560px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .alvo{padding:11px 12px;gap:8px}
  .alvo b{font-size:22px}
  .alvo span{font-size:11.5px}
  .card{padding:14px}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;gap:16px;padding-top:12px}
  nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav button{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:7px;padding:7px 11px}
  nav button[aria-current="true"]{border-left:0;border-bottom-color:var(--amber)}
  nav button i{display:none}
  .nav-lbl{display:none}
  .brand span{display:none}
  h2{font-size:23px}
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>FASE 1</b><span>Comunicação visual · Playbook</span></div>
    <div class="searchwrap">
      <span class="mag">⌕</span>
      <input id="q" type="search" placeholder="Buscar: produto, objeção, termo técnico, processo…" autocomplete="off">
      <div id="results" hidden></div>
    </div>
    <button class="tbtn" id="theme" type="button">Tema</button>
  </div>
</header>

<div class="shell">
<nav id="nav" aria-label="Seções do playbook"></nav>
<main id="main"></main>
</div>

const store = {
  get(k, d){ try{ const v = localStorage.getItem("fase1:"+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("fase1:"+k, JSON.stringify(v)); }catch(e){} }
};

/* ============ navegação ============ */
const nav = document.getElementById("nav");
const main = document.getElementById("main");
let grupoAtual = "";
SECOES.forEach((s, i) => {
  if (s.grupo !== grupoAtual){ grupoAtual = s.grupo;
    const l = document.createElement("div"); l.className = "nav-lbl"; l.textContent = s.grupo; nav.appendChild(l); }
  const b = document.createElement("button");
  b.type = "button"; b.dataset.go = s.id;
  b.innerHTML = '<i>' + String(i + 1).padStart(2, "0") + '</i>' + s.nome;
  b.addEventListener("click", () => abrir(s.id));
  nav.appendChild(b);
});

function abrir(id, termo){
  const s = SECOES.find(x => x.id === id) || SECOES[0];
  main.innerHTML = '<div class="sec-head"><div class="eyebrow">' + s.eyebrow + '</div><h2>' + s.titulo + '</h2><p>' + s.sub + '</p></div>' + s.html;
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === s.id)));
  montar(s.id);
  store.set("sec", s.id);
  const vistas = store.get("vistas", {});
  if (!vistas[s.id]){ vistas[s.id] = true; store.set("vistas", vistas); }
  atualizarProgresso();
  window.scrollTo({top:0, behavior:"instant"});
  if (termo) realcar(termo);
}

function realcar(t){
  const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
  main.querySelectorAll("p,td,li,summary,h3,.lbl").forEach(el => {
    if (el.children.length === 0 && re.test(el.textContent))
      el.innerHTML = el.innerHTML.replace(re, "<mark>$1</mark>");
  });
  const m = main.querySelector("mark");
  if (m) m.scrollIntoView({block:"center", behavior:"smooth"});
}

/* ============ montagem por seção ============ */
function montar(id){
  if (id === "funil") montarFunil();
  if (id === "objecoes") montarObjecoes();
  if (id === "produtos") montarProdutos();
  if (id === "glossario") montarGlossario();
  if (id === "reuniao") checklist("ck-reuniao", CK_REUNIAO, "ckreu");
  if (id === "os") { checklist("ck-os", CK_OS, "ckos", statusOS); statusOS(); }
  if (id === "onboarding"){ checklist("ck-sem1", CK_SEM1, "cksem1"); checklist("ck-onb", CK_ONB, "ckonb", progressoOnb); progressoOnb(); }
  if (id === "progresso"){ pintarProgresso(); pintarRanking(); }
  main.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => copiar(b)));
}

function copiar(btn){
  const txt = Array.from(btn.parentElement.querySelectorAll("p")).map(p => p.textContent.trim()).join("\n\n");
  const ok = () => { btn.textContent = "Copiado"; setTimeout(() => btn.textContent = "Copiar", 1600); };
  try{
    navigator.clipboard.writeText(txt).then(ok).catch(() => selecionar(btn));
  }catch(e){ selecionar(btn); }
}
function selecionar(btn){
  const r = document.createRange(); r.selectNodeContents(btn.parentElement);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  btn.textContent = "Selecionado"; setTimeout(() => btn.textContent = "Copiar", 1600);
}

/* --- funil invertido --- */
function montarFunil(){
  const ids = ["cm","pc","tk","tf","tp","tr"];
  const salvo = store.get("funil", null);
  if (salvo) ids.forEach(i => { if (salvo[i] != null) document.getElementById(i).value = salvo[i]; });
  const calc = () => {
    const g = i => Number(document.getElementById(i).value) || 0;
    const cm = g("cm"), pc = Math.max(0.1, g("pc")), tk = Math.max(1, g("tk"));
    const tf = Math.min(100, Math.max(1, g("tf"))), tp = Math.min(100, Math.max(1, g("tp"))), tr = Math.min(100, Math.max(1, g("tr")));
    const venda = cm / (pc/100);
    const vendas = Math.ceil(venda / tk);
    const props = Math.ceil(vendas / (tf/100));
    const reus  = Math.ceil(props / (tp/100));
    const pros  = Math.ceil(reus / (tr/100));
    const brl = n => n.toLocaleString("pt-BR", {style:"currency", currency:"BRL", maximumFractionDigits:0});
    document.getElementById("o-venda").textContent = brl(venda);
    document.getElementById("o-vendas").textContent = vendas;
    document.getElementById("o-prop").textContent = props;
    document.getElementById("o-reu").textContent = reus;
    document.getElementById("o-pros").textContent = pros;
    const dp = Math.ceil(pros/22), dr = (reus/22), dpr = (props/22);
    document.getElementById("o-dia-pros").textContent = dp;
    document.getElementById("o-dia-reu").textContent = dr.toFixed(1).replace(".", ",");
    document.getElementById("o-dia-prop").textContent = dpr.toFixed(1).replace(".", ",");
    const cmp = document.getElementById("o-cmp");
    if (dp <= 20){ cmp.className = "note ok";
      cmp.innerHTML = "<b>Cabe na sua rotina.</b> A meta da casa é 10 ligações e 10 mensagens por dia — 20 contatos. A sua conta pede " + dp + " prospecções por dia."; }
    else { cmp.className = "note warn";
      cmp.innerHTML = "<b>Acima do padrão da casa.</b> A meta da casa dá 20 contatos por dia e a sua conta pede " + dp + ". Reveja o ticket médio, a taxa de fechamento ou a comissão desejada — ou combine um plano com o gerente."; }
    const vals = {}; ids.forEach(i => vals[i] = document.getElementById(i).value);
    store.set("funil", vals);
  };
  ids.forEach(i => document.getElementById(i).addEventListener("input", calc));
  calc();
}

/* --- objeções --- */

const icone = f => ICONES[f] || ICONES["Outros"];

let famAtiva = "";
function montarProdutos(){
  const chips = document.getElementById("pchips");
  chips.innerHTML = '<button class="chip" type="button" data-f="">Todas</button>' +
    FAMILIAS.map(f => '<button class="chip" type="button" data-f="' + f + '">' + f + '</button>').join("");
  chips.querySelectorAll(".chip").forEach(c => {
    c.setAttribute("aria-pressed", String(c.dataset.f === famAtiva));
    c.addEventListener("click", () => { famAtiva = c.dataset.f;
      chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === famAtiva)));
      listarProdutos(); });
  });
  document.getElementById("pq").addEventListener("input", listarProdutos);
  listarProdutos();
}
function listarProdutos(){
  const t = (document.getElementById("pq").value || "").trim().toLowerCase();
  const lista = PRODUTOS.filter(p =>
    (!famAtiva || p.f === famAtiva) &&
    (!t || p.n.toLowerCase().includes(t) || p.c.includes(t)));

  const fb = document.getElementById("fambox");
  if (fb){
    if (famAtiva && FAMINFO[famAtiva]){
      fb.innerHTML = '<div class="fambox"><span class="ico">' + icone(famAtiva) + '</span><div style="min-width:0">' +
        '<h4>' + famAtiva + '</h4><p>' + FAMINFO[famAtiva][0] + '</p>' +
        '<p class="pg">Pergunte sempre: "' + FAMINFO[famAtiva][1] + '"</p></div></div>';
    } else fb.innerHTML = "";
  }

  document.getElementById("pcount").textContent =
    lista.length + " de " + PRODUTOS.length + " produtos" + (famAtiva ? " · " + famAtiva : "");
  document.getElementById("plist").innerHTML = lista.length
    ? lista.slice(0, 400).map(p =>
        '<div class="prow"><span class="ico">' + icone(p.f) + '</span>' +
        '<code>' + p.c + '</code><span class="nm">' + p.n + '</span>' +
        '<span class="tag">' + p.f + '</span></div>').join("")
    : '<div class="prow" style="color:var(--muted)">Nenhum produto encontrado. Tente outro termo ou limpe o filtro.</div>';
}

/* --- glossário --- */
function montarGlossario(){
  const render = () => {
    const t = (document.getElementById("gq").value || "").trim().toLowerCase();
    const l = GLOSSARIO.filter(g => !t || g[0].toLowerCase().includes(t) || g[1].toLowerCase().includes(t));
    document.getElementById("gtab").innerHTML = l.length
      ? l.map(g => '<tr><td style="width:150px"><b>' + g[0] + '</b></td><td>' + g[1] + '</td></tr>').join("")
      : '<tr><td style="color:var(--muted)">Nenhum termo encontrado.</td></tr>';
  };
  document.getElementById("gq").addEventListener("input", render);
  render();
}

/* --- checklists --- */
function checklist(alvo, itens, chave, aoMudar){
  const box = document.getElementById(alvo);
  if (!box) return;
  const estado = store.get(chave, {});
  box.innerHTML = itens.map((t, i) =>
    '<label class="ck' + (estado[i] ? " on" : "") + '"><input type="checkbox" id="' + chave + '-' + i + '"' + (estado[i] ? " checked" : "") + '><span>' + t + '</span></label>').join("");
  box.querySelectorAll("input").forEach((inp, i) => inp.addEventListener("change", () => {
    const e = store.get(chave, {}); e[i] = inp.checked; store.set(chave, e);
    inp.parentElement.classList.toggle("on", inp.checked);
    if (aoMudar) aoMudar();
    atualizarProgresso();
  }));
}
function statusOS(){
  const e = store.get("ckos", {});
  const falta = CK_OS.filter((_, i) => !e[i]).length;
  const el = document.getElementById("os-status");
  if (!el) return;
  if (falta === 0){ el.className = "note ok"; el.innerHTML = "<b>OS pronta para enviar.</b> Com tudo isso preenchido, ela passa na conferência de primeira."; }
  else { el.className = "note warn"; el.innerHTML = "<b>Faltam " + falta + " " + (falta === 1 ? "item" : "itens") + ".</b> OS incompleta volta, atrasa a entrega e trava a fila da produção."; }
}
function progressoOnb(){
  const e = store.get("ckonb", {});
  const feitos = CK_ONB.filter((_, i) => e[i]).length;
  const pct = Math.round(feitos / CK_ONB.length * 100);
  const bar = document.getElementById("onb-bar"), lbl = document.getElementById("onb-pct");
  if (bar) bar.style.width = pct + "%";
  if (lbl) lbl.textContent = feitos + " de " + CK_ONB.length + " concluídos · " + pct + "%";
}

/* ============ progresso e ranking ============ */
const CHECKS = {ckreu:CK_REUNIAO.length, ckos:CK_OS.length, cksem1:CK_SEM1.length, ckonb:CK_ONB.length};
let DB = null, USUARIO = null, MEUID = null, RANKING = [], ultimoEnvio = "", timerEnvio = null;

function calcular(){
  const vistas = Object.keys(store.get("vistas", {})).length;
  let feitos = 0, total = 0;
  Object.keys(CHECKS).forEach(k => {
    total += CHECKS[k];
    const e = store.get(k, {});
    feitos += Object.keys(e).filter(i => e[i]).length;
  });
  const pSec = Math.min(1, vistas / SECOES.length);
  const pChk = total ? feitos / total : 0;
  return {pct: Math.round((pSec*0.6 + pChk*0.4) * 100), secoes: vistas, checks: feitos, totalChecks: total};
}

function pintarProgresso(){
  const p = calcular();
  const n = document.getElementById("pct-num");
  if (!n) return;
  n.textContent = p.pct + "%";
  document.getElementById("pct-bar").style.width = p.pct + "%";
  document.getElementById("pct-sec").textContent = p.secoes + " de " + SECOES.length;
  document.getElementById("pct-chk").textContent = p.checks + " de " + p.totalChecks;
}

function atualizarProgresso(){
  pintarProgresso();
  if (!DB || !MEUID) return;
  clearTimeout(timerEnvio);
  timerEnvio = setTimeout(async () => {
    const p = calcular();
    const chave = p.pct + "|" + p.secoes + "|" + p.checks;
    if (chave === ultimoEnvio) return;
    ultimoEnvio = chave;
    try { await DB.doc("progresso/" + MEUID).set({pct:p.pct, secoes:p.secoes, checks:p.checks, atualizado:Date.now()}); }
    catch(e){ ultimoEnvio = ""; }
  }, 1200);
}

async function pintarRanking(){
  const box = document.getElementById("rank");
  if (!box) return;
  if (!DB){
    box.innerHTML = '<div class="note">O ranking aparece quando você abre o playbook pelo link compartilhado, com a sua conta. Seu progresso continua salvo neste navegador.</div>';
    return;
  }
  if (!RANKING.length){
    box.innerHTML = '<p style="color:var(--muted);font-size:13.5px">Ninguém registrou progresso ainda. Abra as seções e marque os checklists — em segundos você aparece aqui.</p>';
    return;
  }
  let perfis = {};
  if (USUARIO){ try { perfis = await USUARIO.profiles(RANKING.map(r => r.id)); } catch(e){ perfis = {}; } }
  box.innerHTML = RANKING.map((r, i) => {
    const eu = r.id === MEUID;
    return '<div class="kv"><span style="display:flex;gap:10px;align-items:center;min-width:0">' +
      '<b style="color:var(--amber);min-width:18px">' + (i+1) + '</b>' +
      '<span class="nome" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap' + (eu ? ';font-weight:600' : '') + '"></span>' +
      (eu ? '<span class="tag">você</span>' : '') +
      '</span><b>' + (Number(r.pct) || 0) + '%</b></div>';
  }).join("");
  box.querySelectorAll(".kv").forEach((el, i) => {
    const r = RANKING[i], p = perfis[r.id] || {};
    el.querySelector(".nome").textContent = p.name || (r.id === MEUID ? "Você" : "Alguém do time");
  });
}

(async () => {
  try{
    if (!window.claude || !claude.use) { pintarRanking(); return; }
    DB = await claude.use("db");
    USUARIO = await claude.use("user");
    if (USUARIO) MEUID = await USUARIO.id();
    if (DB){
      DB.collection("progresso").orderBy("pct", "desc").limit(30).onSnapshot(
        snap => { RANKING = snap.docs.map(d => Object.assign({id:d.id}, d.data())); pintarRanking(); },
        () => {}
      );
    }
    atualizarProgresso();
    pintarRanking();
  }catch(e){ pintarRanking(); }
})();

/* ============ busca global ============ */
const INDICE = [];
SECOES.forEach(s => {
  const tmp = document.createElement("div"); tmp.innerHTML = s.html;
  tmp.querySelectorAll("p,li,td,summary,h3").forEach(el => {
    const t = el.textContent.replace(/\s+/g," ").trim();
    if (t.length > 14) INDICE.push({sec:s.id, nome:s.nome, txt:t});
  });
  INDICE.push({sec:s.id, nome:s.nome, txt:s.titulo + " — " + s.sub});
});
OBJECOES.forEach(o => INDICE.push({sec:"objecoes", nome:"Objeções", txt:o[0] + " " + o[2]}));
GLOSSARIO.forEach(g => INDICE.push({sec:"glossario", nome:"Glossário", txt:g[0] + ": " + g[1]}));

const q = document.getElementById("q"), results = document.getElementById("results");
q.addEventListener("input", () => {
  const t = q.value.trim().toLowerCase();
  if (t.length < 2){ results.hidden = true; return; }
  const prods = PRODUTOS.filter(p => p.n.toLowerCase().includes(t) || p.c.includes(t)).slice(0, 6);
  const txt = INDICE.filter(i => i.txt.toLowerCase().includes(t)).slice(0, 10);
  let html = prods.map(p =>
    '<button type="button" data-sec="produtos" data-t="' + esc(p.n) + '"><span class="where">Produto · ' + p.f + '</span>' + esc(p.n) + ' <code style="color:var(--muted)">' + p.c + '</code></button>').join("");
  html += txt.map(i =>
    '<button type="button" data-sec="' + i.sec + '" data-t="' + esc(q.value.trim()) + '"><span class="where">' + i.nome + '</span>' + esc(corta(i.txt, t)) + '</button>').join("");
  results.innerHTML = html || '<div class="empty">Nada encontrado para “' + esc(q.value) + '”.</div>';
  results.hidden = false;
  results.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    results.hidden = true;
    if (b.dataset.sec === "produtos"){ abrir("produtos"); const pq = document.getElementById("pq"); if (pq){ pq.value = q.value.trim(); listarProdutos(); } }
    else abrir(b.dataset.sec, b.dataset.t);
  }));
});
q.addEventListener("keydown", e => { if (e.key === "Escape"){ q.value = ""; results.hidden = true; } });
document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) results.hidden = true; });
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function corta(t, termo){
  const i = t.toLowerCase().indexOf(termo);
  if (i < 0 || t.length < 96) return t.slice(0, 96);
  const ini = Math.max(0, i - 36);
  return (ini > 0 ? "…" : "") + t.slice(ini, ini + 96) + "…";
}

/* ============ tema ============ */
document.getElementById("theme").addEventListener("click", () => {
  const atual = document.documentElement.getAttribute("data-theme");
  const escuroAgora = atual ? atual === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const novo = escuroAgora ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", novo);
  store.set("tema", novo);
});
const temaSalvo = store.get("tema", null);
if (temaSalvo) document.documentElement.setAttribute("data-theme", temaSalvo);

/* ============ início ============ */
abrir(store.get("sec", "dia"));
</script>
